<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hpmagicworld – Vertaalbeheer</title>
<style>
:root{font-family:Arial,sans-serif;color:#202431;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:22px}
main{max-width:1100px;margin:0 auto}.panel{background:#fff;border:1px solid #e1e5ed;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #15213b0b}
h1{font-size:25px;margin:0 0 8px}p{line-height:1.45;color:#596273}
input,button,textarea{font:inherit;border-radius:8px;padding:10px;border:1px solid #cbd2df}
input{width:100%;min-width:0}button{background:#273b67;color:white;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#e9edf5;color:#26324a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
#status{padding:10px;border-radius:8px;background:#eef2f8;color:#34415b;margin-top:12px;white-space:pre-wrap}
#status.error{background:#fff0ef;color:#9b2820}#status.ok{background:#eaf8ef;color:#176334}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app-layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:16px;align-items:start}
.side-menu{background:#fff;border:1px solid #e1e5ed;border-radius:14px;padding:12px;position:sticky;top:14px}
.side-menu h3{font-size:14px;color:#6b7280;margin:4px 8px 12px}
.menu-btn{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#26324a;border:1px solid transparent}
.menu-btn.active{background:#e9edf5;border-color:#d5dcea;color:#273b67}
.tool-view{min-width:0}
.tool-view>h2{margin:0 0 12px}
@media(max-width:720px){.app-layout{grid-template-columns:1fr}.side-menu{position:static;display:flex;gap:8px}.side-menu h3{display:none}.menu-btn{margin:0;text-align:center}}

.page-tools{margin-top:18px;border-top:1px solid #e1e5ed;padding-top:16px}
.page-tools h2{margin:0 0 8px}
.content-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.content-form label{font-size:13px;color:#596273;font-weight:600}
.content-form input,.content-form textarea,.content-form select{display:block;width:100%;margin-top:5px}
.content-form textarea{min-height:90px}
.content-item{border:1px solid #e1e5ed;border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.content-item p{white-space:pre-wrap;margin:8px 0}
@media(max-width:720px){.content-form{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e7eaf0;text-align:left;vertical-align:top}th{font-size:13px;color:#596273}
td.key{width:24%;font-size:13px;overflow-wrap:anywhere;color:#586174}td input{margin:2px 0}
.save{white-space:nowrap;padding:9px 12px}
.small{font-size:12px;color:#6b7280}
.hidden{display:none}
@media(max-width:720px){body{padding:10px}.toolbar{grid-template-columns:1fr}.panel{padding:14px}table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid #e1e5ed;border-radius:10px;margin:12px 0;padding:8px}td{border:0;padding:5px}td.key{width:auto;font-weight:bold}td:before{display:block;font-size:11px;color:#737d8f;margin-bottom:3px}td.nl:before{content:"Nederlands"}td.en:before{content:"English"}td.pt:before{content:"Português"}}</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Muggle Ministry – Vertaalbeheer</h1>
    <p>Dit is onze interne tool voor het portaal!</p>
  </div>
  <section id="login" class="panel">
    <h2>Inloggen</h2>
    <div class="row"><input id="email" type="email" placeholder="E-mailadres" autocomplete="username"><input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password"></div>
    <p><button id="loginBtn">Inloggen</button></p>
  </section>
  <section id="app" class="panel hidden">
    <div class="toolbar" style="justify-content:space-between;margin-bottom:14px">
      <strong>Beheerportaal</strong>
      <button class="secondary" id="logoutBtn">Uitloggen</button>
    </div>
    <div class="app-layout">
      <nav class="side-menu" aria-label="Beheermenu">
        <h3>MENU</h3>
        <button type="button" class="menu-btn active" id="translationMenu">Vertaal tool</button>
        <button type="button" class="menu-btn" id="pageMenu">Beheer tool</button>
      </nav>
      <div class="tool-view">
        <section id="translationView">
          <h2>Vertaal tool</h2>
          <div class="toolbar">
            <input id="search" placeholder="Zoek een vertaling…">
            <button class="secondary" id="reloadBtn">Vernieuwen</button>
            <button id="syncGithubBtn">↥ Sync naar GitHub</button>
          </div>
          <p id="count" class="small"></p>
          <div style="overflow-x:auto">
            <table><thead><tr><th>Sleutel</th><th>Nederlands</th><th>English</th><th>Português</th><th></th></tr></thead><tbody id="rows"></tbody></table>
          </div>
        </section>
        <section id="pageView" class="page-tools" style="display:none">
          <h2>Beheer tool</h2>
          <p class="small">Beheer hier navigatieknoppen en tekstblokken voor je pagina's.</p>
          <form id="contentForm">
            <div class="content-form">
              <label>Soort onderdeel<select id="contentType"><option value="text">Tekstblok</option><option value="button">Navigatieknop</option></select></label>
              <label>Pagina<select id="contentPage"><option value="all">Alle pagina's</option><option value="home">Startpagina</option><option value="forum">Forum</option><option value="profile">Profiel</option><option value="custom">Andere pagina</option></select></label>
              <label>Naam / titel<input id="contentTitle" required placeholder="Bijv. Welkom op Hpmagicworld"></label>
              <label>Link (alleen voor navigatieknoppen)<input id="contentUrl" placeholder="https://..."></label>
              <label style="grid-column:1/-1">Tekst (alleen voor tekstblokken)<textarea id="contentBody" placeholder="Typ hier je tekst..."></textarea></label>
              <label>Plek<select id="contentPlacement"><option value="top">Bovenaan</option><option value="bottom">Onderaan</option><option value="sidebar">Zijbalk</option></select></label>
              <label>Andere pagina (optioneel)<input id="contentCustomPage" placeholder="Bijv. /h1-magie"></label>
            </div>
            <button type="submit" id="contentSave">Onderdeel toevoegen</button>
            <button type="button" class="secondary" id="contentCancel" style="display:none">Annuleren</button>
          </form>
          <div id="contentList"></div>
        </section>
      </div>
    </div>
  </section>
  <div id="status" role="status">Vul je beheerdersgegevens in om te beginnen.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://vuaajsjjluwgqmneinds.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_tto6sNxZPLv1VhUdMRlPHg_ptzg9odx';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let allRows = [];
  const status = (message, kind='') => { $('status').textContent=message; $('status').className=kind; };
  const showApp = yes => { $('app').classList.toggle('hidden',!yes); $('login').classList.toggle('hidden',yes); };

  async function checkAdmin() {
    const {data:{user},error:userError}=await db.auth.getUser();
    if(userError || !user) return false;
    const {data,error}=await db.from('translation_admins').select('user_id').eq('user_id',user.id).maybeSingle();
    if(error) throw error;
    return !!data;
  }
  async function loadRows() {
    status('Vertalingen laden…');
    const allowed=await checkAdmin();
    if(!allowed){showApp(false);status('Dit account staat niet in translation_admins. Log in met het juiste beheerdersaccount.','error');return;}
    const {data,error}=await db.from('translations').select('translation_key,nl,en,pt').order('translation_key');
    if(error) throw error;
    allRows=data||[];
    showApp(true); render(); await loadContent();
    status(allRows.length+' vertalingen geladen.','ok');
  }
  function render() {
    const q=$('search').value.trim().toLowerCase();
    const filtered=allRows.filter(r=>[r.translation_key,r.nl,r.en,r.pt].some(v=>(v||'').toLowerCase().includes(q)));
    $('count').textContent=filtered.length+' van '+allRows.length+' vertalingen';
    const body=$('rows'); body.replaceChildren();
    filtered.forEach(r=>{
      const tr=document.createElement('tr');
      const key=document.createElement('td');key.className='key';key.textContent=r.translation_key;tr.append(key);
      for(const lang of ['nl','en','pt']){
        const td=document.createElement('td');td.className=lang;
        const input=document.createElement('input');input.value=r[lang]||'';input.dataset.lang=lang;input.setAttribute('aria-label',lang+' '+r.translation_key);
        td.append(input);tr.append(td);
      }
      const action=document.createElement('td');const btn=document.createElement('button');btn.className='save';btn.textContent='Opslaan';
      btn.addEventListener('click',()=>saveRow(r,tr,btn));action.append(btn);tr.append(action);body.append(tr);
    });
  }
  async function saveRow(original,tr,btn) {
    btn.disabled=true;btn.textContent='Opslaan…';status('Wijziging opslaan…');
    const values={translation_key:original.translation_key};
    tr.querySelectorAll('input[data-lang]').forEach(i=>values[i.dataset.lang]=i.value);
    const {error}=await db.from('translations').upsert(values,{onConflict:'translation_key'});
    btn.disabled=false;btn.textContent='Opslaan';
    if(error){status('Opslaan mislukt: '+error.message,'error');return;}
    const index=allRows.findIndex(x=>x.translation_key===original.translation_key);
    if(index>=0)allRows[index]={...allRows[index],...values};
    status('Opgeslagen: '+original.translation_key+'. Vernieuw daarna het forum met Ctrl + F5.','ok');
  }
  $('loginBtn').addEventListener('click',async()=>{
    const email=$('email').value.trim(),password=$('password').value;
    if(!email||!password){status('Vul je e-mailadres en wachtwoord in.','error');return;}
    $('loginBtn').disabled=true;status('Inloggen…');
    const {error}=await db.auth.signInWithPassword({email,password});
    $('loginBtn').disabled=false;
    if(error){status('Inloggen mislukt: '+error.message,'error');return;}
    try{await loadRows();}catch(e){status('Fout bij laden: '+e.message,'error');}
  });
  $('reloadBtn').addEventListener('click',async()=>{try{await loadRows();}catch(e){status('Fout bij laden: '+e.message,'error');}});
  $('syncGithubBtn').addEventListener('click',async()=>{
    if(!confirm('Alle actuele vertalingen uit Supabase synchroniseren naar translations.js op GitHub?'))return;
    const btn=$('syncGithubBtn');btn.disabled=true;btn.textContent='Synchroniseren…';status('Vertalingen naar GitHub synchroniseren…');
    try{
      const {data,error}=await db.functions.invoke('sync-translations',{body:{}});
      if(error)throw error;
      if(!data||!data.success)throw new Error(data?.error||'Synchronisatie is niet bevestigd.');
      status(data.message+(data.commit?String.fromCharCode(10)+'GitHub commit: '+data.commit:''),'ok');
    }catch(e){status('Synchroniseren mislukt: '+(e.message||String(e)),'error');}
    finally{btn.disabled=false;btn.textContent='↥ Sync naar GitHub';}
  });

  let contentItems=[], editingContentId=null;
  async function loadContent(){
    const {data,error}=await db.from('page_content').select('*').order('created_at',{ascending:false});
    if(error){status('Pagina-inhoud laden mislukt: '+error.message+' (mogelijk moet de tabel nog worden aangemaakt).','error');return;}
    contentItems=data||[]; renderContent();
  }
  function renderContent(){
    const host=$('contentList');host.replaceChildren();
    if(!contentItems.length){host.textContent='Nog geen onderdelen toegevoegd.';return;}
    contentItems.forEach(item=>{
      const card=document.createElement('article');card.className='content-item';
      const heading=document.createElement('strong');heading.textContent=(item.type==='button'?'Navigatieknop: ':'Tekstblok: ')+item.title;card.append(heading);
      const meta=document.createElement('div');meta.className='small';meta.textContent='Pagina: '+item.page+' · Plek: '+item.placement;card.append(meta);
      const detail=document.createElement('p');detail.textContent=item.type==='button'?(item.url||'Geen link ingesteld'):(item.body||'');card.append(detail);
      const edit=document.createElement('button');edit.className='secondary';edit.textContent='Bewerken';edit.addEventListener('click',()=>{editingContentId=item.id;$('contentType').value=item.type;$('contentPage').value=['all','home','forum','profile','custom'].includes(item.page)?item.page:'custom';$('contentTitle').value=item.title;$('contentUrl').value=item.url||'';$('contentBody').value=item.body||'';$('contentPlacement').value=item.placement;$('contentCustomPage').value=item.page==='custom'?'':item.page;$('contentSave').textContent='Wijzigingen opslaan';$('contentCancel').style.display='inline-block';});
      const del=document.createElement('button');del.textContent='Verwijderen';del.style.marginLeft='8px';del.addEventListener('click',async()=>{if(!confirm('Dit onderdeel verwijderen?'))return;const {error}=await db.from('page_content').delete().eq('id',item.id);if(error){status(error.message,'error');return;}status('Onderdeel verwijderd.','ok');await loadContent();});
      card.append(edit,del);host.append(card);
    });
  }
  $('contentType').addEventListener('change',()=>{const isButton=$('contentType').value==='button';$('contentUrl').disabled=!isButton;$('contentBody').disabled=isButton;});
  $('contentForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const page=$('contentPage').value==='custom'?$('contentCustomPage').value.trim():'';
    const payload={type:$('contentType').value,page:page||$('contentPage').value,title:$('contentTitle').value.trim(),url:$('contentUrl').value.trim(),body:$('contentBody').value,placement:$('contentPlacement').value,updated_at:new Date().toISOString()};
    if(!payload.title){status('Vul een naam of titel in.','error');return;}
    const query=editingContentId?db.from('page_content').update(payload).eq('id',editingContentId):db.from('page_content').insert(payload);
    const {error}=await query;
    if(error){status('Opslaan mislukt: '+error.message,'error');return;}
    $('contentForm').reset();editingContentId=null;$('contentSave').textContent='Onderdeel toevoegen';$('contentCancel').style.display='none';$('contentType').dispatchEvent(new Event('change'));status('Pagina-onderdeel opgeslagen.','ok');await loadContent();
  });
  $('contentCancel').addEventListener('click',()=>{$('contentForm').reset();editingContentId=null;$('contentSave').textContent='Onderdeel toevoegen';$('contentCancel').style.display='none';$('contentType').dispatchEvent(new Event('change'));});

  $('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();allRows=[];showApp(false);status('Je bent uitgelogd.');});
  function showTool(which){
    const translations=which==='translations';
    $('translationView').style.display=translations?'block':'none';
    $('pageView').style.display=translations?'none':'block';
    $('translationMenu').classList.toggle('active',translations);
    $('pageMenu').classList.toggle('active',!translations);
    if(!translations)loadContent();
  }
  $('translationMenu').addEventListener('click',()=>showTool('translations'));
  $('pageMenu').addEventListener('click',()=>showTool('pages'));
  $('search').addEventListener('input',render);
  db.auth.getSession().then(async({data})=>{if(data.session){try{await loadRows();}catch(e){status('Fout bij laden: '+e.message,'error');}}});
})();
</script>
</body>
</html>
