
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hpmagicworld - Vertalingenbeheer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111c2b;--line:#2a3a51;--text:#edf2fa;--muted:#9ba9bc;--gold:#c5a76a;--accent:#8c7cf0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#242747,transparent 55%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
.wrap{width:min(1180px,calc(100% - 32px));margin:38px auto}
.brand{text-align:center;margin-bottom:24px}
.brand img{max-width:240px;max-height:90px;object-fit:contain}
.brand h1{margin:10px 0 4px;font-size:25px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 16px 45px #0005}
.login{max-width:440px;margin:0 auto}
.field{display:block;margin:12px 0}
.field span{display:block;margin-bottom:6px;color:#c4cede;font-weight:650}
.field input,.field textarea,.search{width:100%;background:#0b1421;color:var(--text);border:1px solid #34465f;border-radius:9px;padding:11px;outline:none}
.field textarea{min-height:70px;resize:vertical}
.btn{border:1px solid #4c477b;background:#29264b;color:white;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#7968e8,#6654cf)}
.btn.ghost{background:#182538;border-color:#34465f}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .search{flex:1;min-width:180px}
.status{margin-top:12px;color:var(--muted);white-space:pre-wrap}
.status.error{color:#ffb7c2}
.status.ok{color:#9de5c8}
#editor{display:none}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.entry{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0;background:#0e1826}
.key{font-weight:800;color:#e4d8ff;margin-bottom:10px;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cols label{font-size:11px;color:var(--muted);font-weight:700}
@media(max-width:720px){.cols{grid-template-columns:1fr}.wrap{margin:18px auto}.panel{padding:15px}}
</style>
</head>
<body>
<main class="wrap">
<header class="brand">
<img src="https://i28.servimg.com/u/f28/11/54/28/73/logo10.png" alt="Hpmagicworld">
<h1>Vertalingenbeheer</h1>
<div class="muted">Beveiligde beheeromgeving · Nederlands / English / Português</div>
</header>

<section id="login" class="panel login">
<h2>Inloggen</h2>
<p class="muted">Log in met je Supabase-beheerdersaccount.</p>
<form id="loginForm">
<label class="field"><span>E-mailadres</span><input id="email" type="email" autocomplete="username" required></label>
<label class="field"><span>Wachtwoord</span><input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn primary" type="submit">Inloggen</button>
</form>
<div id="loginStatus" class="status"></div>
</section>

<section id="editor" class="panel">
<div class="toolbar">
<div><h2 style="margin:0">Vertalingen</h2><div id="who" class="muted"></div></div>
<div class="row">
<input id="filter" class="search" placeholder="Zoek op sleutel of tekst">
<button id="add" class="btn ghost">+ Nieuwe sleutel</button>
<button id="refresh" class="btn ghost">Vernieuwen</button>
<button id="logout" class="btn">Uitloggen</button>
</div>
</div>
<div id="entries"></div>
<div id="saveStatus" class="status"></div>
</section>
</main>

<script>
const SUPABASE_URL='https://vuaajsjjluwgqmneinds.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_tto6sNxZPLv1VhUdMRlPHg_ptzg9odx';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let rows=[];
const $=id=>document.getElementById(id);
const status=(id,msg,kind='')=>{
$(id).textContent=msg;
$(id).className='status '+kind;
};

async function showSession(){
const {data:{session}}=await db.auth.getSession();
if(!session){
$('login').style.display='block';
$('editor').style.display='none';
return;
}
const {data:admin,error}=await db.from('translation_admins')
.select('user_id').eq('user_id',session.user.id).maybeSingle();

if(error||!admin){
await db.auth.signOut();
$('login').style.display='block';
$('editor').style.display='none';
status('loginStatus','Dit account heeft geen beheerrechten.','error');
return;
}
$('login').style.display='none';
$('editor').style.display='block';
$('who').textContent='Ingelogd als '+session.user.email;
await load();
}

async function load(){
status('saveStatus','Vertalingen laden…');
const {data,error}=await db.from('translations')
.select('*').order('translation_key');
if(error){
status('saveStatus',error.message,'error');
return;
}
rows=data||[];
render();
status('saveStatus',rows.length+' vertaalsleutels geladen.','ok');
}

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function render(){
const q=$('filter').value.toLowerCase();
$('entries').innerHTML=rows.filter(r=>
(r.translation_key+' '+r.nl+' '+r.en+' '+r.pt).toLowerCase().includes(q)
).map(r=>`
<article class="entry" data-key="${esc(r.translation_key)}">
<div class="key">${esc(r.translation_key)}</div>
<div class="cols">
<label>Nederlands<textarea data-lang="nl">${esc(r.nl)}</textarea></label>
<label>English<textarea data-lang="en">${esc(r.en)}</textarea></label>
<label>Português<textarea data-lang="pt">${esc(r.pt)}</textarea></label>
</div>
<div class="row" style="justify-content:flex-end;margin-top:10px">
<button class="btn primary" data-save>Opslaan</button>
<button class="btn ghost" data-delete>Verwijderen</button>
</div>
</article>`).join('')||'<p class="muted">Geen vertalingen gevonden.</p>';
}

$('entries').addEventListener('click',async e=>{
const card=e.target.closest('.entry');
if(!card)return;
const key=card.dataset.key;

if(e.target.matches('[data-save]')){
const payload={
translation_key:key,
nl:card.querySelector('[data-lang="nl"]').value,
en:card.querySelector('[data-lang="en"]').value,
pt:card.querySelector('[data-lang="pt"]').value,
updated_at:new Date().toISOString()
};
const {error}=await db.from('translations')
.upsert(payload,{onConflict:'translation_key'});
status('saveStatus',error?error.message:'Opgeslagen: '+key,error?'error':'ok');
if(!error)await load();
}

if(e.target.matches('[data-delete]')){
if(!confirm('Sleutel '+key+' verwijderen?'))return;
const {error}=await db.from('translations')
.delete().eq('translation_key',key);
status('saveStatus',error?error.message:'Verwijderd: '+key,error?'error':'ok');
if(!error)await load();
}
});

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
status('loginStatus','Inloggen…');
const {error}=await db.auth.signInWithPassword({
email:$('email').value,
password:$('password').value
});
if(error){
status('loginStatus',error.message,'error');
return;
}
status('loginStatus','');
await showSession();
});

$('logout').onclick=async()=>{
await db.auth.signOut();
await showSession();
};
$('refresh').onclick=load;
$('filter').oninput=render;

$('add').onclick=async()=>{
const key=prompt('Nieuwe vertaalsleutel (bijv. home.title):');
if(!key||!key.trim())return;
const {error}=await db.from('translations').insert({
translation_key:key.trim(),nl:'',en:'',pt:''
});
if(error){
status('saveStatus',error.message,'error');
return;
}
await load();
};

db.auth.onAuthStateChange(()=>setTimeout(showSession,0));
showSession();
</script>
</body>
</html>
