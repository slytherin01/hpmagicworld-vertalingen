<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muggle Ministry | Admin Tool</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#263653 0%,#101a2a 48%,#080e18 100%);color:#edf2fa}
.card{width:min(680px,100%);padding:42px 34px;text-align:center;background:rgba(13,22,35,.94);border:1px solid #c9a45c;border-radius:20px;box-shadow:0 22px 70px #0008}
img{width:150px;height:92px;object-fit:contain;margin:0 auto 14px}
h1{font-size:clamp(27px,5vw,40px);margin:0 0 12px;color:#f5d995;letter-spacing:.2px}
p{max-width:500px;margin:0 auto 26px;color:#c2ccda;line-height:1.7}
a{display:inline-block;padding:13px 25px;border-radius:10px;background:linear-gradient(135deg,#e6cf91,#c9a45c 55%,#ad8541);color:#101827;text-decoration:none;font-weight:800}
a:hover{filter:brightness(1.1)}
.small{margin-top:22px;font-size:12px;color:#8fa0b7}
</style>
</head>
<body>
<main class="card">
<img src="https://i28.servimg.com/u/f28/11/54/28/73/logo10.png" alt="Muggle Ministry">
<h1>Muggle Ministry | Admin Tool</h1>
<p>Welkom bij de beheeromgeving van Muggle Ministry. Vanaf deze startpagina kun je veilig doorgaan naar de vertalingen en beheertools.</p>
<a href="./tool/">Open de Admin Tool</a>
<div class="small">Beveiligde beheeromgeving</div>
</main>
</body>
</html>
